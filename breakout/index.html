<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>彩虹打砖块 · Lian 的游戏小站</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#141e30,#243b55);min-height:100vh;color:#ecf0f1;display:flex;flex-direction:column;align-items:center}
  header{width:100%;max-width:520px;padding:12px 16px 4px;display:flex;align-items:center;gap:12px}
  header a{color:#74b9ff;text-decoration:none;font-size:15px;font-weight:700;white-space:nowrap}
  header h1{font-size:21px;letter-spacing:1px}
  .hud{width:100%;max-width:520px;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{flex:1;min-width:70px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:7px 6px;text-align:center}
  .chip .k{font-size:11px;color:#aebfd0}
  .chip .v{font-size:19px;font-weight:800;margin-top:1px}
  .stage{width:100%;max-width:520px;padding:4px 12px 0;position:relative}
  canvas{width:100%;display:block;border-radius:16px;background:linear-gradient(180deg,#0b1026 0%,#16213e 60%,#1a2a4a 100%);box-shadow:0 14px 34px rgba(0,0,0,.5);touch-action:none}
  .overlay{position:absolute;inset:4px 12px 0;border-radius:16px;background:rgba(5,8,20,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;backdrop-filter:blur(2px)}
  .overlay.hidden{display:none}
  .overlay .big{font-size:52px}
  .overlay h2{font-size:26px}
  .overlay p{color:#c7d3e0;font-size:14px;line-height:1.8;max-width:340px}
  .btn{border:none;cursor:pointer;border-radius:999px;padding:14px 34px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,#e17055,#d63031);box-shadow:0 8px 20px rgba(214,48,49,.4);min-height:52px;min-width:170px}
  .btn:active{transform:scale(.97)}
  .btn.blue{background:linear-gradient(135deg,#0984e3,#6c5ce7);box-shadow:0 8px 20px rgba(9,132,227,.4)}
  .controls{width:100%;max-width:520px;padding:12px 16px 6px;display:flex;gap:10px}
  .controls button{flex:1;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;border-radius:14px;padding:13px 6px;font-size:15px;font-weight:700;cursor:pointer;min-height:50px}
  .controls button:active{background:rgba(255,255,255,.25)}
  .tip{max-width:520px;padding:2px 20px 22px;color:#8fa6b8;font-size:12.5px;line-height:1.9;text-align:center}
</style>
</head>
<body>
<header>
  <a href="../">← 回主页</a>
  <h1>🧱 彩虹打砖块</h1>
</header>

<div class="hud">
  <div class="chip"><div class="k">得分</div><div class="v" id="score">0</div></div>
  <div class="chip"><div class="k">关卡</div><div class="v" id="level">1 / 3</div></div>
  <div class="chip"><div class="k">生命</div><div class="v" id="lives">❤️❤️❤️</div></div>
  <div class="chip"><div class="k">剩余砖块</div><div class="v" id="left">0</div></div>
</div>

<div class="stage">
  <canvas id="game" width="480" height="640"></canvas>
  <div class="overlay" id="overlay">
    <div class="big" id="ovEmoji">🧱</div>
    <h2 id="ovTitle">彩虹打砖块</h2>
    <p id="ovText">手指拖动（或移动鼠标）控制挡板反弹小球，把彩虹砖块全部打掉过关！<br>金色砖要打两下；接住掉落道具：⭐加宽挡板、💊加一条命。共 3 关，砖块越往后越硬。</p>
    <button class="btn" id="ovBtn">开始游戏</button>
  </div>
</div>

<div class="controls">
  <button id="btnPause">⏸ 暂停</button>
  <button id="btnRestart">🔄 重新开始</button>
  <button id="btnSound">🔊 音效开</button>
</div>

<p class="tip">操作：触摸拖动 / 鼠标移动 / ← → 方向键移动挡板；空格或点按画面发射小球。<br>小球碰到挡板的位置越靠边，反弹角度越斜 —— 用这招瞄准角落的砖！</p>

<script>
"use strict";
// ===== 彩虹打砖块：单文件原生实现 =====
var W = 480, H = 640;
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");

// 高清屏适配：按设备像素比放大画布后备缓冲，逻辑坐标仍为 480x640
(function fitCanvas(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
})();

var el = {
  score: document.getElementById("score"),
  level: document.getElementById("level"),
  lives: document.getElementById("lives"),
  left: document.getElementById("left"),
  overlay: document.getElementById("overlay"),
  ovEmoji: document.getElementById("ovEmoji"),
  ovTitle: document.getElementById("ovTitle"),
  ovText: document.getElementById("ovText"),
  ovBtn: document.getElementById("ovBtn")
};

var ROW_COLORS = ["#ff7675","#fdcb6e","#55efc4","#74b9ff","#a29bfe","#fd79a8"];
var state = null;
var soundOn = true;
var audioCtx = null;

function beep(freq, dur, type, vol){
  if(!soundOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.05, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){ /* 音效失败不影响游戏 */ }
}

// 关卡布局：字符串地图，'.' 空格，'1' 普通砖(1血)，'2' 硬砖(2血)，'3' 铁砖(3血)
var LEVELS = [
  [
    "1111111111",
    "1111111111",
    "1222222221",
    "1111111111",
    "1........1"
  ],
  [
    "2.111111.2",
    "1111111111",
    ".12222221.",
    "1111221111",
    "2..1111..2",
    "1111111111"
  ],
  [
    "3331111333",
    "1222222221",
    "11.2222.11",
    "1221111121",
    ".11111111.",
    "2..1..1..2",
    "1111111111"
  ]
];

function buildBricks(levelIdx){
  var map = LEVELS[levelIdx];
  var cols = 10, gap = 6, top = 64, bh = 24;
  var bw = (W - 24 - gap * (cols - 1)) / cols;
  var bricks = [];
  for(var r = 0; r < map.length; r++){
    for(var c = 0; c < cols; c++){
      var ch = map[r].charAt(c);
      if(ch === "." || ch === " ") continue;
      var hp = parseInt(ch, 10);
      bricks.push({
        x: 12 + c * (bw + gap), y: top + r * (bh + gap),
        w: bw, h: bh, hp: hp, maxHp: hp,
        color: ROW_COLORS[r % ROW_COLORS.length], alive: true
      });
    }
  }
  return bricks;
}

function newGame(){
  state = {
    mode: "ready", // ready | playing | paused | levelclear | gameover | win
    score: 0, level: 0, lives: 3,
    paddle: { w: 92, h: 14, x: W / 2 - 46, y: H - 42, baseW: 92, wideUntil: 0 },
    balls: [], bricks: buildBricks(0), drops: [],
    keys: { left: false, right: false },
    raf: null, lastTs: 0, msg: ""
  };
  resetBall();
  syncHud();
}

function resetBall(){
  var p = state.paddle;
  state.balls = [{
    x: p.x + p.w / 2, y: p.y - 12, r: 9,
    vx: 0, vy: 0, stuck: true, trail: []
  }];
  state.drops = [];
}

function launchBall(){
  for(var i = 0; i < state.balls.length; i++){
    var b = state.balls[i];
    if(b.stuck){
      b.stuck = false;
      var ang = -Math.PI / 2 + (Math.random() * 0.5 - 0.25);
      var speed = 380 + state.level * 30;
      b.vx = Math.cos(ang) * speed;
      b.vy = Math.sin(ang) * speed;
      beep(520, 0.08, "square", 0.05);
    }
  }
  if(state.mode === "ready") state.mode = "playing";
}

function syncHud(){
  el.score.textContent = state.score;
  el.level.textContent = (state.level + 1) + " / " + LEVELS.length;
  var hearts = "";
  for(var i = 0; i < state.lives; i++) hearts += "❤️";
  el.lives.textContent = hearts || "—";
  var left = 0;
  for(var j = 0; j < state.bricks.length; j++) if(state.bricks[j].alive) left++;
  el.left.textContent = left;
}

function showOverlay(emoji, title, text, btnText, btnBlue){
  el.ovEmoji.textContent = emoji;
  el.ovTitle.textContent = title;
  el.ovText.innerHTML = text;
  el.ovBtn.textContent = btnText;
  el.ovBtn.className = "btn" + (btnBlue ? " blue" : "");
  el.overlay.classList.remove("hidden");
}
function hideOverlay(){ el.overlay.classList.add("hidden"); }

// ===== 道具 =====
function maybeDrop(x, y){
  var roll = Math.random();
  if(roll < 0.09) state.drops.push({ x: x, y: y, vy: 150, kind: "wide", emoji: "⭐" });
  else if(roll < 0.13) state.drops.push({ x: x, y: y, vy: 150, kind: "life", emoji: "💊" });
}

// ===== 主循环 =====
function step(ts){
  if(!state) return;
  var dt = Math.min((ts - state.lastTs) / 1000 || 0, 0.033);
  state.lastTs = ts;
  if(state.mode === "playing" || state.mode === "ready") update(dt);
  draw();
  state.raf = requestAnimationFrame(step);
}

function update(dt){
  var p = state.paddle;
  // 键盘移动
  var kSpeed = 520;
  if(state.keys.left) p.x -= kSpeed * dt;
  if(state.keys.right) p.x += kSpeed * dt;
  if(p.x < 6) p.x = 6;
  if(p.x > W - 6 - p.w) p.x = W - 6 - p.w;
  // 加宽到期恢复
  if(p.wideUntil && performance.now() > p.wideUntil){
    p.x += (p.w - p.baseW) / 2; p.w = p.baseW; p.wideUntil = 0;
    if(p.x < 6) p.x = 6; if(p.x > W - 6 - p.w) p.x = W - 6 - p.w;
  }

  // 小球
  for(var i = state.balls.length - 1; i >= 0; i--){
    var b = state.balls[i];
    if(b.stuck){ b.x = p.x + p.w / 2; b.y = p.y - b.r - 2; continue; }
    b.trail.push({ x: b.x, y: b.y });
    if(b.trail.length > 10) b.trail.shift();
    b.x += b.vx * dt; b.y += b.vy * dt;
    // 左右墙
    if(b.x - b.r < 4){ b.x = 4 + b.r; b.vx = Math.abs(b.vx); beep(300, 0.04, "square", 0.03); }
    if(b.x + b.r > W - 4){ b.x = W - 4 - b.r; b.vx = -Math.abs(b.vx); beep(300, 0.04, "square", 0.03); }
    // 顶墙
    if(b.y - b.r < 4){ b.y = 4 + b.r; b.vy = Math.abs(b.vy); beep(300, 0.04, "square", 0.03); }
    // 挡板碰撞
    if(b.vy > 0 && b.y + b.r >= p.y && b.y + b.r <= p.y + p.h + 8 && b.x >= p.x - b.r && b.x <= p.x + p.w + b.r){
      var rel = (b.x - (p.x + p.w / 2)) / (p.w / 2); // -1..1
      if(rel < -1) rel = -1; if(rel > 1) rel = 1;
      var speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      var ang2 = -Math.PI / 2 + rel * (Math.PI / 3); // 最大偏 60°
      b.vx = Math.cos(ang2) * speed;
      b.vy = Math.sin(ang2) * speed;
      b.y = p.y - b.r - 1;
      beep(440, 0.05, "square", 0.04);
    }
    // 砖块碰撞（取第一个命中的活砖）
    for(var j = 0; j < state.bricks.length; j++){
      var br = state.bricks[j];
      if(!br.alive) continue;
      if(b.x + b.r > br.x && b.x - b.r < br.x + br.w && b.y + b.r > br.y && b.y - b.r < br.y + br.h){
        // 由上一帧位置判断撞击面
        var prevX = b.x - b.vx * dt, prevY = b.y - b.vy * dt;
        var hitSide = (prevX + b.r <= br.x || prevX - b.r >= br.x + br.w);
        var hitTop = (prevY + b.r <= br.y || prevY - b.r >= br.y + br.h);
        if(hitSide && !hitTop) b.vx = -b.vx;
        else if(hitTop && !hitSide) b.vy = -b.vy;
        else { b.vy = -b.vy; }
        br.hp -= 1;
        if(br.hp <= 0){
          br.alive = false;
          state.score += 50;
          maybeDrop(br.x + br.w / 2, br.y + br.h / 2);
          beep(720, 0.07, "triangle", 0.06);
        } else {
          state.score += 10;
          beep(560, 0.05, "triangle", 0.05);
        }
        syncHud();
        break;
      }
    }
    // 掉出底部
    if(b.y - b.r > H + 20){
      state.balls.splice(i, 1);
    }
  }

  // 全部球丢失
  if(state.balls.length === 0 && state.mode === "playing"){
    state.lives -= 1;
    syncHud();
    beep(180, 0.25, "sawtooth", 0.06);
    if(state.lives <= 0){
      state.mode = "gameover";
      showOverlay("💥", "游戏结束", "最终得分：<b>" + state.score + "</b><br>别灰心 —— 用挡板边缘打出的斜球更容易钻进砖缝！", "再来一局");
    } else {
      state.mode = "ready";
      resetBall();
      showOverlay("😢", "掉球啦，还剩 " + state.lives + " 条命", "点按钮或按空格，重新发射小球。", "继续", true);
    }
    return;
  }

  // 道具掉落
  for(var d = state.drops.length - 1; d >= 0; d--){
    var dr = state.drops[d];
    dr.y += dr.vy * dt;
    if(dr.y >= p.y && dr.y <= p.y + p.h + 14 && dr.x >= p.x - 8 && dr.x <= p.x + p.w + 8){
      if(dr.kind === "wide"){
        if(!p.wideUntil){ p.x -= 23; }
        p.w = p.baseW + 46; p.wideUntil = performance.now() + 10000;
        if(p.x < 6) p.x = 6; if(p.x > W - 6 - p.w) p.x = W - 6 - p.w;
        state.score += 20;
      } else if(dr.kind === "life"){
        state.lives = Math.min(state.lives + 1, 5);
        state.score += 20;
      }
      beep(880, 0.12, "sine", 0.07);
      state.drops.splice(d, 1);
      syncHud();
    } else if(dr.y > H + 20){
      state.drops.splice(d, 1);
    }
  }

  // 过关判定
  var anyAlive = false;
  for(var k = 0; k < state.bricks.length; k++) if(state.bricks[k].alive){ anyAlive = true; break; }
  if(!anyAlive && state.mode === "playing"){
    state.score += 200;
    if(state.level >= LEVELS.length - 1){
      state.mode = "win";
      syncHud();
      beep(980, 0.3, "sine", 0.07);
      showOverlay("🏆", "全部通关！", "漂亮！3 关彩虹砖全部打完。<br>最终得分：<b>" + state.score + "</b>", "再玩一遍");
    } else {
      state.mode = "levelclear";
      state.level += 1;
      syncHud();
      beep(980, 0.2, "sine", 0.07);
      showOverlay("🎉", "过关！进入第 " + (state.level + 1) + " 关", "砖块更硬了，小球也更快了。得分已 +200 奖励。", "下一关", true);
    }
  }
}

// ===== 绘制 =====
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  // 背景星点（固定伪随机，避免每帧闪烁）
  ctx.fillStyle = "rgba(255,255,255,.35)";
  for(var s = 0; s < 40; s++){
    var sx = ((s * 137) % 460) + 10, sy = ((s * 89) % 600) + 20;
    ctx.fillRect(sx, sy, 2, 2);
  }
  if(!state) return;
  // 砖块
  for(var i = 0; i < state.bricks.length; i++){
    var br = state.bricks[i];
    if(!br.alive) continue;
    var alpha = br.hp / br.maxHp; // 受损变淡 + 裂纹感
    ctx.globalAlpha = 0.45 + 0.55 * alpha;
    ctx.fillStyle = br.color;
    roundRect(br.x, br.y, br.w, br.h, 6); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(255,255,255,.35)";
    roundRect(br.x + 3, br.y + 3, br.w - 6, 7, 3); ctx.fill();
    if(br.maxHp > 1){
      ctx.fillStyle = "#fff";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(String(br.hp), br.x + br.w / 2, br.y + br.h / 2 + 3);
    }
  }
  // 道具
  ctx.font = "20px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for(var d = 0; d < state.drops.length; d++){
    ctx.fillText(state.drops[d].emoji, state.drops[d].x, state.drops[d].y);
  }
  // 挡板
  var p = state.paddle;
  var grad = ctx.createLinearGradient(p.x, p.y, p.x + p.w, p.y);
  grad.addColorStop(0, "#00cec9"); grad.addColorStop(0.5, "#0984e3"); grad.addColorStop(1, "#6c5ce7");
  ctx.fillStyle = grad;
  roundRect(p.x, p.y, p.w, p.h, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.5)";
  roundRect(p.x + 4, p.y + 2, p.w - 8, 4, 2); ctx.fill();
  // 小球 + 拖尾
  for(var bi = 0; bi < state.balls.length; bi++){
    var b = state.balls[bi];
    for(var t = 0; t < b.trail.length; t++){
      var tp = b.trail[t];
      ctx.globalAlpha = (t + 1) / b.trail.length * 0.25;
      ctx.fillStyle = "#ffeaa7";
      ctx.beginPath(); ctx.arc(tp.x, tp.y, b.r * 0.7, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    var bg = ctx.createRadialGradient(b.x - 3, b.y - 3, 1, b.x, b.y, b.r);
    bg.addColorStop(0, "#fff"); bg.addColorStop(0.4, "#ffeaa7"); bg.addColorStop(1, "#f39c12");
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    if(b.stuck){
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.font = "13px sans-serif";
      ctx.fillText("点按或按空格发射 👆", b.x, b.y - 26);
    }
  }
}

// ===== 输入 =====
function canvasX(clientX){
  var rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) * (W / rect.width);
}
function movePaddleTo(clientX){
  if(!state) return;
  var p = state.paddle;
  p.x = canvasX(clientX) - p.w / 2;
  if(p.x < 6) p.x = 6;
  if(p.x > W - 6 - p.w) p.x = W - 6 - p.w;
}
canvas.addEventListener("mousemove", function(e){ movePaddleTo(e.clientX); });
canvas.addEventListener("touchstart", function(e){
  e.preventDefault(); movePaddleTo(e.touches[0].clientX);
  if(state && state.mode === "ready") launchBall();
}, { passive: false });
canvas.addEventListener("touchmove", function(e){
  e.preventDefault(); movePaddleTo(e.touches[0].clientX);
}, { passive: false });
canvas.addEventListener("click", function(){
  if(state && state.mode === "ready") launchBall();
});
document.addEventListener("keydown", function(e){
  if(!state) return;
  if(e.key === "ArrowLeft"){ state.keys.left = true; e.preventDefault(); }
  if(e.key === "ArrowRight"){ state.keys.right = true; e.preventDefault(); }
  if(e.key === " "){
    e.preventDefault();
    if(state.mode === "ready") launchBall();
    else if(state.mode === "paused") togglePause();
  }
});
document.addEventListener("keyup", function(e){
  if(!state) return;
  if(e.key === "ArrowLeft") state.keys.left = false;
  if(e.key === "ArrowRight") state.keys.right = false;
});

// ===== 按钮 =====
function startOrResume(){
  if(!state || state.mode === "gameover" || state.mode === "win"){
    cancelAnimationFrame(state ? state.raf : 0);
    newGame();
    state.mode = "playing";
    hideOverlay();
    launchBall();
    state.lastTs = performance.now();
    state.raf = requestAnimationFrame(step);
    return;
  }
  if(state.mode === "levelclear"){
    state.bricks = buildBricks(state.level);
    resetBall();
    state.mode = "playing";
    syncHud();
    hideOverlay();
    launchBall();
    return;
  }
  hideOverlay();
  if(state.mode === "ready"){ state.mode = "playing"; launchBall(); }
  else if(state.mode === "paused"){ togglePause(); }
}
el.ovBtn.addEventListener("click", startOrResume);

function togglePause(){
  if(!state) return;
  if(state.mode === "playing"){
    state.mode = "paused";
    document.getElementById("btnPause").textContent = "▶ 继续";
    showOverlay("⏸", "已暂停", "休息一下，回来点继续。", "继续", true);
  } else if(state.mode === "paused"){
    state.mode = "playing";
    document.getElementById("btnPause").textContent = "⏸ 暂停";
    hideOverlay();
  }
}
document.getElementById("btnPause").addEventListener("click", togglePause);
document.getElementById("btnRestart").addEventListener("click", function(){
  cancelAnimationFrame(state ? state.raf : 0);
  newGame();
  state.mode = "playing";
  document.getElementById("btnPause").textContent = "⏸ 暂停";
  hideOverlay();
  launchBall();
  state.lastTs = performance.now();
  state.raf = requestAnimationFrame(step);
});
document.getElementById("btnSound").addEventListener("click", function(){
  soundOn = !soundOn;
  this.textContent = soundOn ? "🔊 音效开" : "🔇 音效关";
});

// ===== 启动 =====
newGame();
draw();
</script>
</body>
</html>
