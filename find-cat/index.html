<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>找猫大作战 · Lian 的游戏小站</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#1d2b1f,#2e4a34 60%,#3d5c40);min-height:100vh;color:#f2f5ee}
  .wrap{max-width:880px;margin:0 auto;padding:14px 12px 34px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .back{color:#ffe9a8;text-decoration:none;font-weight:700;font-size:15px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);padding:9px 14px;border-radius:999px}
  h1{font-size:22px;letter-spacing:1px;text-align:center;margin:10px 0 2px}
  .sub{text-align:center;color:#cfe0c8;font-size:13px;line-height:1.7}
  .hud{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
  .chip{background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:7px 12px;font-size:14px;font-weight:700;min-width:86px;text-align:center}
  .chip small{display:block;font-weight:400;font-size:11px;color:#b9cdb2}
  .stage{position:relative;width:100%;aspect-ratio:3/2;border-radius:16px;overflow:hidden;background:#10160f;box-shadow:0 16px 40px rgba(0,0,0,.5);touch-action:none;user-select:none}
  .stage img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none;transform-origin:0 0}
  .ring{position:absolute;border:4px solid #ffd93d;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.35),0 0 24px rgba(255,217,61,.8);transform:translate(-50%,-50%);pointer-events:none;animation:pop .45s ease-out}
  .ring::after{content:"🐱";position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:26px}
  @keyframes pop{0%{scale:2.2;opacity:0}100%{scale:1;opacity:1}}
  .miss{position:absolute;transform:translate(-50%,-50%);font-size:26px;color:#ff5252;text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;animation:fadeout .8s forwards;font-weight:900}
  @keyframes fadeout{to{opacity:0;transform:translate(-50%,-70%)}}
  .hintring{position:absolute;border:3px dashed #7bed9f;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:pulse 0.7s ease-in-out infinite alternate}
  @keyframes pulse{from{box-shadow:0 0 0 0 rgba(123,237,159,.0)}to{box-shadow:0 0 0 14px rgba(123,237,159,.18)}}
  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
  button{font-family:inherit;font-size:16px;font-weight:800;border:none;border-radius:14px;padding:14px 20px;cursor:pointer;min-height:52px;box-shadow:0 6px 16px rgba(0,0,0,.3)}
  button:active{transform:scale(.96)}
  .b-zoom{background:#576574;color:#fff}
  .b-hint{background:#f7b731;color:#4a2f00}
  .b-give{background:rgba(255,255,255,.14);color:#dfe6e9;border:1px solid rgba(255,255,255,.3);box-shadow:none}
  .tip{text-align:center;color:#b9cdb2;font-size:12.5px;margin-top:10px;line-height:1.8}
  .overlay{position:fixed;inset:0;background:rgba(8,14,8,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
  .panel{background:#fffdf5;color:#2d3436;border-radius:20px;max-width:430px;width:100%;padding:26px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .panel .big{font-size:52px}
  .panel h2{font-size:23px;margin:8px 0 6px}
  .panel p{font-size:14.5px;color:#57606a;line-height:1.8}
  .panel .score{font-size:30px;font-weight:900;color:#e17055;margin:8px 0}
  .panel .stars{font-size:30px;letter-spacing:4px}
  .b-go{background:#00b894;color:#fff;width:100%;margin-top:14px;font-size:18px}
  .b-again{background:#0984e3;color:#fff;width:100%;margin-top:10px;font-size:18px}
  .hidden{display:none!important}
  .paws{text-align:center;font-size:17px;letter-spacing:6px;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="../">← 回主页</a>
    <span style="font-size:13px;color:#b9cdb2">照片里真藏了猫 · 点中它！</span>
  </div>
  <h1>🐱 找猫大作战</h1>
  <p class="sub">每张照片里都藏着一只猫，和环境融为一体。点一点你觉得是猫的地方，点中过关！</p>
  <div class="paws" id="paws">🐾 ⚪ ⚪</div>

  <div class="hud">
    <div class="chip"><small>关卡</small><span id="hLevel">1 / 3</span></div>
    <div class="chip"><small>用时</small><span id="hTime">0:00</span></div>
    <div class="chip"><small>点错</small><span id="hMiss">0 次</span></div>
    <div class="chip"><small>总分</small><span id="hScore">0</span></div>
  </div>

  <div class="stage" id="stage">
    <img id="photo" alt="藏着猫的照片" draggable="false">
  </div>

  <div class="controls">
    <button class="b-zoom" id="btnZoom">🔍 放大看</button>
    <button class="b-hint" id="btnHint">💡 提示（-150 分）</button>
    <button class="b-give" id="btnGive">🏳️ 看答案</button>
  </div>
  <p class="tip">操作：点/点按照片猜猫的位置 · 放大后拖动照片平移，再点按猜位置<br>每关满分 1000：耗时、点错、用提示都会扣分。小心，照片里可能有假猫（玩偶）！</p>
</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>

// cx/cy: 猫中心位置（占照片宽/高的百分比）；r: 命中半径（占照片宽的百分比）
const LEVELS = [
  { scene:"阳光客厅", cat:"橘猫",   cx:50.2, cy:34.0, r:6.5, intro:"橘猫躲在客厅里，据说只露出了一颗脑袋……",           answer:"橘猫从沙发靠垫后面探出头，橘色和靠垫太像啦" },
  { scene:"后院花园", cat:"狸花猫", cx:28.2, cy:85.3, r:7.5, intro:"狸花猫钻进了花园，条纹就是它最好的迷彩服。",         answer:"狸花猫蹲在左下角灌木丛的阴影里" },
  { scene:"凌乱卧室", cat:"黑猫",   cx:60.6, cy:67.2, r:8.0, intro:"黑猫在卧室里睡着了。注意：架子上有只猫玩偶，别上当！", answer:"黑猫蜷在深色被子上睡着了，和被子一个颜色" }
];

const $ = id => document.getElementById(id);
const stage = $("stage"), photo = $("photo"), overlay = $("overlay"), panel = $("panel");

let level = 0;              // 当前关卡下标
let totalScore = 0, totalMiss = 0;
let levelStart = 0;         // 本关开始时刻(ms)
let levelMiss = 0, levelHints = 0;
let elapsedBefore = 0;      // 之前关卡累计用时(s)
let playing = false;        // 本关是否进行中
let zoom = 1, ox = 0, oy = 0;
let timerId = null;

let AC = null;
function beep(freq, dur, type, gain){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.value = gain || 0.12;
    o.connect(g); g.connect(AC.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.stop(AC.currentTime + dur);
  }catch(e){}
}
const sndGood = () => { beep(660, .12, "sine"); setTimeout(()=>beep(990, .2, "sine"), 110); };
const sndBad  = () => beep(160, .18, "square", .06);

function fmtTime(s){ return Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0"); }
function nowSec(){ return elapsedBefore + (playing ? (Date.now()-levelStart)/1000 : 0); }

function updateHUD(){
  $("hLevel").textContent = (level+1) + " / " + LEVELS.length;
  $("hMiss").textContent = totalMiss + " 次";
  $("hScore").textContent = totalScore;
  $("paws").textContent = LEVELS.map((_,i)=> i<level ? "🐱" : (i===level ? "🐾" : "⚪")).join(" ");
}
function tick(){ $("hTime").textContent = fmtTime(nowSec()); }

function setZoom(z){
  zoom = z;
  const r = stage.getBoundingClientRect();
  ox = Math.min(0, Math.max(r.width  - r.width*zoom,  ox));
  oy = Math.min(0, Math.max(r.height - r.height*zoom, oy));
  applyT();
  $("btnZoom").textContent = zoom > 1 ? "↩️ 还原" : "🔍 放大看";
}
function applyT(){ photo.style.transform = "translate(" + ox + "px," + oy + "px) scale(" + zoom + ")"; }
function clampPan(){
  const r = stage.getBoundingClientRect();
  ox = Math.min(0, Math.max(r.width  - r.width*zoom,  ox));
  oy = Math.min(0, Math.max(r.height - r.height*zoom, oy));
}

function clearMarks(){ stage.querySelectorAll(".ring,.miss,.hintring").forEach(el=>el.remove()); }

function startLevel(i){
  level = i; levelMiss = 0; levelHints = 0;
  clearMarks();
  photo.src = IMGS[i];
  zoom = 1; ox = 0; oy = 0; applyT();
  $("btnZoom").textContent = "🔍 放大看";
  playing = false;
  updateHUD(); tick();
  const L = LEVELS[i];
  panel.innerHTML =
    '<div class="big">🐱</div><h2>第 ' + (i+1) + ' 关 · ' + L.scene + '</h2>' +
    '<p>' + L.intro + '</p><p>找到藏起来的<b>' + L.cat + '</b>，点中它过关。</p>' +
    '<button class="b-go" id="btnStart">开始找猫</button>';
  overlay.classList.remove("hidden");
  $("btnStart").onclick = () => {
    overlay.classList.add("hidden");
    playing = true; levelStart = Date.now();
  };
}

function levelScore(gaveUp){
  if (gaveUp) return 0;
  const secs = (Date.now()-levelStart)/1000;
  return Math.max(100, Math.round(1000 - secs*10 - levelMiss*80 - levelHints*150));
}

function finishLevel(gaveUp){
  playing = false;
  elapsedBefore += (Date.now()-levelStart)/1000;
  const sc = levelScore(gaveUp);
  totalScore += sc;
  showRing(true);
  if (!gaveUp) sndGood();
  updateHUD(); tick();
  const L = LEVELS[level];
  const last = level === LEVELS.length - 1;
  setTimeout(() => {
    panel.innerHTML =
      '<div class="big">' + (gaveUp ? "👀" : "🎉") + '</div>' +
      '<h2>' + (gaveUp ? "答案揭晓" : "找到了！") + '</h2>' +
      '<p>' + L.answer + '</p>' +
      '<div class="score">本关 +' + sc + ' 分</div>' +
      '<p>本关点错 ' + levelMiss + ' 次 · 用提示 ' + levelHints + ' 次</p>' +
      '<button class="b-go" id="btnNext">' + (last ? "看总成绩 🏆" : "下一关 →") + '</button>';
    overlay.classList.remove("hidden");
    $("btnNext").onclick = () => {
      overlay.classList.add("hidden");
      if (last) showFinal(); else startLevel(level+1);
    };
  }, gaveUp ? 400 : 1000);
}

function showFinal(){
  const t = Math.round(elapsedBefore);
  const stars = totalScore >= 2600 ? 3 : (totalScore >= 2000 ? 2 : 1);
  panel.innerHTML =
    '<div class="big">🏆</div><h2>全部找到啦！</h2>' +
    '<div class="stars">' + "⭐".repeat(stars) + "☆".repeat(3-stars) + '</div>' +
    '<div class="score">' + totalScore + ' 分</div>' +
    '<p>总用时 ' + fmtTime(t) + ' · 一共点错 ' + totalMiss + ' 次<br>' +
    (stars===3 ? "火眼金睛，猫猫无处可藏！" : stars===2 ? "眼力不错，再快一点就满星啦！" : "猫猫藏得太深？再来一局挑战满星！") + '</p>' +
    '<button class="b-again" id="btnAgain">🔁 再来一局</button>';
  overlay.classList.remove("hidden");
  $("paws").textContent = LEVELS.map(()=>"🐱").join(" ");
  $("btnAgain").onclick = () => {
    totalScore = 0; totalMiss = 0; elapsedBefore = 0;
    overlay.classList.add("hidden");
    startLevel(0);
  };
}

function showRing(big){
  const L = LEVELS[level];
  const pr = photo.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  const cxPx = pr.left + L.cx/100*pr.width  - sr.left;
  const cyPx = pr.top  + L.cy/100*pr.height - sr.top;
  const d = document.createElement("div");
  d.className = "ring";
  d.style.left = (cxPx/sr.width*100) + "%";
  d.style.top  = (cyPx/sr.height*100) + "%";
  const size = L.r*2/100*pr.width;
  d.style.width = size + "px"; d.style.height = size + "px";
  stage.appendChild(d);
}

function showHint(){
  if (!playing) return;
  levelHints++;
  const L = LEVELS[level];
  const pr = photo.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  const cxPx = pr.left + L.cx/100*pr.width  - sr.left;
  const cyPx = pr.top  + L.cy/100*pr.height - sr.top;
  const d = document.createElement("div");
  d.className = "hintring";
  const radPct = levelHints === 1 ? 26 : 15;   // 第二次提示圈更小
  const size = radPct*2/100*pr.width;
  d.style.width = size + "px"; d.style.height = size + "px";
  d.style.left = (cxPx/sr.width*100) + "%";
  d.style.top  = (cyPx/sr.height*100) + "%";
  stage.appendChild(d);
  setTimeout(()=>d.remove(), 2600);
  totalScore = Math.max(0, totalScore); // 提示扣分在本关结算时扣除
  updateHUD();
}

function guess(clientX, clientY){
  if (!playing) return;
  const pr = photo.getBoundingClientRect();
  const fx = (clientX - pr.left) / pr.width;    // 照片内相对位置 0~1
  const fy = (clientY - pr.top)  / pr.height;
  if (fx < 0 || fx > 1 || fy < 0 || fy > 1) return;
  const L = LEVELS[level];
  const dx = (fx*100 - L.cx) / 100 * pr.width;
  const dy = (fy*100 - L.cy) / 100 * pr.height;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const hitR = L.r / 100 * pr.width;
  if (dist <= hitR){
    finishLevel(false);
  } else {
    levelMiss++; totalMiss++;
    sndBad();
    const sr = stage.getBoundingClientRect();
    const m = document.createElement("div");
    m.className = "miss"; m.textContent = "✖";
    m.style.left = ((clientX - sr.left)/sr.width*100) + "%";
    m.style.top  = ((clientY - sr.top)/sr.height*100) + "%";
    stage.appendChild(m);
    setTimeout(()=>m.remove(), 800);
    updateHUD();
  }
}

// 点按 = 猜位置；拖动（放大时）= 平移照片
let pDown = null, pMoved = false;
stage.addEventListener("pointerdown", e => {
  pDown = { x:e.clientX, y:e.clientY, ox:ox, oy:oy };
  pMoved = false;
});
stage.addEventListener("pointermove", e => {
  if (!pDown || zoom <= 1) return;
  const dx = e.clientX - pDown.x, dy = e.clientY - pDown.y;
  if (Math.abs(dx) + Math.abs(dy) > 7) pMoved = true;
  if (pMoved){ ox = pDown.ox + dx; oy = pDown.oy + dy; clampPan(); applyT(); }
});
stage.addEventListener("pointerup", e => {
  if (pDown && !pMoved) guess(e.clientX, e.clientY);
  pDown = null;
});
stage.addEventListener("pointercancel", () => { pDown = null; });

$("btnZoom").onclick = () => setZoom(zoom > 1 ? 1 : 2);
$("btnHint").onclick = showHint;
$("btnGive").onclick = () => { if (playing) finishLevel(true); };

timerId = setInterval(tick, 250);
startLevel(0);
</script>
