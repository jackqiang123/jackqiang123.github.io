<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>五子棋大作战 · 游戏小站</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#1a2a1e,#2d4a33 60%,#1f3d2b);min-height:100vh;color:#f1f8f3}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 30px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .top a{color:#a8e6b0;text-decoration:none;font-size:15px;font-weight:700}
  .top .sound{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
  h1{text-align:center;font-size:26px;letter-spacing:2px;text-shadow:0 3px 14px rgba(0,0,0,.4)}
  .sub{text-align:center;color:#c8e6cc;font-size:13px;margin:6px 0 12px;line-height:1.6}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 4px;text-align:center}
  .stat b{display:block;font-size:19px;color:#ffe082}
  .stat span{font-size:11.5px;color:#c8e6cc}
  .turnbar{text-align:center;font-size:15px;font-weight:700;margin-bottom:10px;min-height:22px}
  .turnbar .dot{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-1px;margin-right:6px}
  .board-box{position:relative;background:linear-gradient(145deg,#e8b96a,#d9a24f);border-radius:14px;padding:10px;box-shadow:0 14px 34px rgba(0,0,0,.45), inset 0 0 0 2px rgba(120,72,20,.35)}
  canvas{display:block;width:100%;height:auto;border-radius:6px;touch-action:manipulation;cursor:pointer}
  .overlay{position:absolute;inset:10px;border-radius:6px;background:rgba(20,26,20,.72);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;z-index:5}
  .overlay.show{display:flex}
  .overlay .big{font-size:44px}
  .overlay h2{font-size:24px}
  .overlay p{font-size:14px;color:#d7e8d9;line-height:1.7;padding:0 18px}
  .btn{background:#ff8f00;color:#fff;border:none;border-radius:999px;padding:12px 26px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:rgba(255,255,255,.16);box-shadow:none}
  .controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .controls .btn{flex:1;padding:12px 6px;font-size:15px}
  .panel{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;margin-top:12px}
  .panel h3{font-size:14px;color:#ffe082;margin-bottom:8px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;border:2px solid rgba(255,255,255,.25);background:transparent;color:#e8f5e9;border-radius:10px;padding:10px 4px;font-size:14px;font-weight:700;cursor:pointer}
  .seg button.on{background:#ff8f00;border-color:#ff8f00;color:#fff}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px}
  .switch{position:relative;width:52px;height:28px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:rgba(255,255,255,.25);border-radius:999px;transition:.2s;cursor:pointer}
  .slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:#ff8f00}
  .switch input:checked + .slider:before{transform:translateX(24px)}
  .tips{margin-top:12px;font-size:12.5px;color:#b9d6bd;line-height:1.9;text-align:center}
  .hint-ring{animation:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="../">← 回主页</a>
    <button class="sound" id="soundBtn">🔊 音效开</button>
  </div>
  <h1>⚫⚪ 五子棋大作战</h1>
  <p class="sub">15×15 棋盘，和电脑 AI 下五子棋：先连成五子就赢！<br>点棋盘落子，AI 会自己思考走棋。</p>

  <div class="stats">
    <div class="stat"><b id="stWins">0</b><span>胜</span></div>
    <div class="stat"><b id="stLosses">0</b><span>负</span></div>
    <div class="stat"><b id="stDraws">0</b><span>和</span></div>
    <div class="stat"><b id="stStreak">0</b><span>连胜</span></div>
    <div class="stat"><b id="stBest">0</b><span>最高连胜</span></div>
  </div>

  <div class="turnbar" id="turnBar">轮到你落子（黑棋）</div>

  <div class="board-box">
    <canvas id="board" width="600" height="600"></canvas>
    <div class="overlay" id="overlay">
      <div class="big" id="ovEmoji">🏆</div>
      <h2 id="ovTitle">你赢了！</h2>
      <p id="ovText"></p>
      <button class="btn" id="againBtn">再来一局</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="newBtn">🔄 新开一局</button>
    <button class="btn ghost" id="undoBtn">↩️ 悔棋</button>
    <button class="btn ghost" id="hintBtn">💡 提示</button>
    <button class="btn ghost" id="resignBtn">🏳️ 认输</button>
  </div>

  <div class="panel">
    <h3>难度</h3>
    <div class="seg" id="diffSeg">
      <button data-d="easy">😊 简单</button>
      <button data-d="normal" class="on">🙂 普通</button>
      <button data-d="hard">😤 困难</button>
    </div>
    <div class="row">
      <span>让电脑先手（电脑执黑）</span>
      <label class="switch"><input type="checkbox" id="aiFirst"><span class="slider"></span></label>
    </div>
  </div>

  <p class="tips">小窍门：活三要冲四、堵住对手的活四；开局占天元（中心点）最稳。<br>黑棋先行，双方轮流落子，先连成横/竖/斜任意五子者胜，棋盘下满无人连五则为和棋。</p>
</div>

<script>
'use strict';
/* ===== 核心逻辑（纯函数，便于测试） ===== */
var SIZE = 15;
var DIRS = [[1,0],[0,1],[1,1],[1,-1]];

function newBoard(){ var b=[]; for(var i=0;i<SIZE;i++){ b.push(new Array(SIZE).fill(0)); } return b; }
function inBoard(x,y){ return x>=0 && x<SIZE && y>=0 && y<SIZE; }

/* 从 (x,y) 沿 4 个方向数连子，返回该子所在的最长连线长度 */
function lineLen(board,x,y,color){
  var best=1;
  for(var d=0;d<4;d++){
    var dx=DIRS[d][0], dy=DIRS[d][1], n=1, i;
    for(i=1;i<5;i++){ var nx=x+dx*i, ny=y+dy*i; if(!inBoard(nx,ny)||board[ny][nx]!==color) break; n++; }
    for(i=1;i<5;i++){ var nx2=x-dx*i, ny2=y-dy*i; if(!inBoard(nx2,ny2)||board[ny2][nx2]!==color) break; n++; }
    if(n>best) best=n;
  }
  return best;
}
function isWin(board,x,y,color){ return lineLen(board,x,y,color)>=5; }
function boardFull(board){
  for(var y=0;y<SIZE;y++) for(var x=0;x<SIZE;x++) if(board[y][x]===0) return false;
  return true;
}

/* 评估在 (x,y) 落 color 子的棋形分：按最强方向计分 */
function patternScore(board,x,y,color){
  var total=0;
  for(var d=0;d<4;d++){
    var dx=DIRS[d][0], dy=DIRS[d][1];
    var cnt=1, open=0, i;
    for(i=1;i<5;i++){ var nx=x+dx*i, ny=y+dy*i;
      if(!inBoard(nx,ny)) break;
      if(board[ny][nx]===color) cnt++;
      else { if(board[ny][nx]===0) open++; break; }
    }
    for(i=1;i<5;i++){ var nx2=x-dx*i, ny2=y-dy*i;
      if(!inBoard(nx2,ny2)) break;
      if(board[ny2][nx2]===color) cnt++;
      else { if(board[ny2][nx2]===0) open++; break; }
    }
    var s=0;
    if(cnt>=5) s=1000000;
    else if(cnt===4) s = open===2 ? 100000 : 10000;
    else if(cnt===3) s = open===2 ? 8000 : 800;
    else if(cnt===2) s = open===2 ? 800 : 80;
    else s = open===2 ? 40 : 4;
    if(s>total) total=s;
  }
  return total;
}

/* 候选落点：已有棋子周围 2 格内的空格；空棋盘只返回天元 */
function candidates(board){
  var seen={}, list=[], has=false;
  for(var y=0;y<SIZE;y++) for(var x=0;x<SIZE;x++) if(board[y][x]!==0){ has=true; break; }
  if(!has) return [[7,7]];
  for(var y2=0;y2<SIZE;y2++) for(var x2=0;x2<SIZE;x2++){
    if(board[y2][x2]!==0) continue;
    var near=false;
    for(var dy=-2;dy<=2 && !near;dy++) for(var dx=-2;dx<=2;dx++){
      var nx=x2+dx, ny=y2+dy;
      if(inBoard(nx,ny) && board[ny][nx]!==0){ near=true; break; }
    }
    if(near){ var k=x2+','+y2; if(!seen[k]){ seen[k]=1; list.push([x2,y2]); } }
  }
  return list;
}

/* 评估一手棋：进攻分 + 防守分（对手在该点能拿到的分） */
function moveScore(board,x,y,color){
  var opp = color===1?2:1;
  var atk = patternScore(board,x,y,color);
  var def = patternScore(board,x,y,opp);
  return atk + def*0.92;
}

/* AI 选点：difficulty easy/normal/hard；rand 注入便于测试 */
function aiPick(board,color,difficulty,rand){
  rand = rand || Math.random;
  var cands = candidates(board);
  var scored = cands.map(function(p){
    return {x:p[0], y:p[1], s:moveScore(board,p[0],p[1],color)};
  });
  scored.sort(function(a,b){ return b.s-a.s; });
  if(difficulty==='easy'){
    if(rand()<0.35) return cands[Math.floor(rand()*cands.length)];
    var top = scored.slice(0,Math.min(5,scored.length));
    return top[Math.floor(rand()*top.length)];
  }
  if(difficulty==='normal') return scored[0];
  /* hard: 一步前瞻——在最优的 6 个候选里，选对手最佳回应分最小的那手 */
  var opp = color===1?2:1;
  var best=null, bestVal=Infinity;
  var pool = scored.slice(0,Math.min(6,scored.length));
  for(var i=0;i<pool.length;i++){
    var p=pool[i];
    board[p.y][p.x]=color;
    if(isWin(board,p.x,p.y,color)){ board[p.y][p.x]=0; return p; }
    var oppCands = candidates(board);
    var oppBest=0;
    for(var j=0;j<oppCands.length;j++){
      var q=oppCands[j];
      var qs=moveScore(board,q[0],q[1],opp);
      if(qs>oppBest) oppBest=qs;
    }
    var val = oppBest - p.s*0.15;
    board[p.y][p.x]=0;
    if(val<bestVal){ bestVal=val; best=p; }
  }
  return best || scored[0];
}
</script>

<script>
'use strict';
/* ===== 界面与对局流程 ===== */
var canvas = document.getElementById('board');
var ctx = canvas.getContext('2d');
var turnBar = document.getElementById('turnBar');
var overlay = document.getElementById('overlay');
var soundOn = true, audioCtx = null;

var board = newBoard();
var history = [];          /* [{x,y,color}] */
var over = false, busy = false;   /* busy: AI 思考中 */
var difficulty = 'normal';
var aiFirstFlag = false;
var playerColor = 1;       /* 1 黑 2 白 */
var aiColor = 2;
var lastMove = null, hintPos = null;
var stats = {wins:0, losses:0, draws:0, streak:0, best:0};
try{
  var saved = JSON.parse(localStorage.getItem('gomoku-stats')||'null');
  if(saved) stats = saved;
}catch(e){}

function saveStats(){ try{ localStorage.setItem('gomoku-stats', JSON.stringify(stats)); }catch(e){} }
function renderStats(){
  document.getElementById('stWins').textContent = stats.wins;
  document.getElementById('stLosses').textContent = stats.losses;
  document.getElementById('stDraws').textContent = stats.draws;
  document.getElementById('stStreak').textContent = stats.streak;
  document.getElementById('stBest').textContent = stats.best;
}

function beep(freq,dur,type,vol){
  if(!soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function sndPlace(){ beep(520,0.09,'triangle',0.14); }
function sndWin(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ beep(f,0.22,'sine',0.14); }, i*130); }); }
function sndLose(){ [400,340,280,200].forEach(function(f,i){ setTimeout(function(){ beep(f,0.22,'sine',0.12); }, i*130); }); }

/* ---- 棋盘绘制 ---- */
var PAD = 32, CELL = (600 - PAD*2) / (SIZE-1);
function draw(){
  ctx.clearRect(0,0,600,600);
  var g = ctx.createLinearGradient(0,0,600,600);
  g.addColorStop(0,'#eec27c'); g.addColorStop(1,'#d9a24f');
  ctx.fillStyle = g; ctx.fillRect(0,0,600,600);
  ctx.strokeStyle = 'rgba(90,50,10,.85)'; ctx.lineWidth = 1.4;
  for(var i=0;i<SIZE;i++){
    ctx.beginPath(); ctx.moveTo(PAD+i*CELL, PAD); ctx.lineTo(PAD+i*CELL, PAD+(SIZE-1)*CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PAD, PAD+i*CELL); ctx.lineTo(PAD+(SIZE-1)*CELL, PAD+i*CELL); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(90,50,10,.9)';
  [[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(function(p){
    ctx.beginPath(); ctx.arc(PAD+p[0]*CELL, PAD+p[1]*CELL, 4.5, 0, Math.PI*2); ctx.fill();
  });
  for(var y=0;y<SIZE;y++) for(var x=0;x<SIZE;x++){
    var c = board[y][x];
    if(c) drawStone(x,y,c);
  }
  if(lastMove){
    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(PAD+lastMove.x*CELL, PAD+lastMove.y*CELL, CELL*0.32, 0, Math.PI*2); ctx.stroke();
  }
  if(hintPos){
    ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(PAD+hintPos.x*CELL, PAD+hintPos.y*CELL, CELL*0.42, 0, Math.PI*2); ctx.stroke();
  }
}
function drawStone(x,y,color){
  var cx=PAD+x*CELL, cy=PAD+y*CELL, r=CELL*0.44;
  var g = ctx.createRadialGradient(cx-r*0.35, cy-r*0.35, r*0.1, cx, cy, r);
  if(color===1){ g.addColorStop(0,'#666'); g.addColorStop(0.55,'#222'); g.addColorStop(1,'#000'); }
  else { g.addColorStop(0,'#fff'); g.addColorStop(0.7,'#f0ead8'); g.addColorStop(1,'#c9bfa5'); }
  ctx.beginPath(); ctx.arc(cx+1.5, cy+2, r, 0, Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle=g; ctx.fill();
}

function setTurn(text, color){
  var dot = color ? '<span class="dot" style="background:'+(color===1?'#111':'#fff')+';border:1px solid rgba(255,255,255,.6)"></span>' : '';
  turnBar.innerHTML = dot + text;
}

/* ---- 对局流程 ---- */
function place(x,y,color){
  board[y][x]=color;
  history.push({x:x,y:y,color:color});
  lastMove={x:x,y:y};
  hintPos=null;
  sndPlace();
  draw();
  if(isWin(board,x,y,color)) return 'win';
  if(boardFull(board)) return 'draw';
  return null;
}
function endGame(result){
  over=true; busy=false;
  var emoji=document.getElementById('ovEmoji'), t=document.getElementById('ovTitle'), txt=document.getElementById('ovText');
  if(result==='win'){
    stats.wins++; stats.streak++;
    if(stats.streak>stats.best) stats.best=stats.streak;
    emoji.textContent='🏆'; t.textContent='你赢了！';
    txt.textContent='五子连珠，漂亮！你击败了'+diffName()+'难度的电脑。连胜 '+stats.streak+' 局，最高连胜 '+stats.best+' 局。';
    sndWin();
  }else if(result==='lose'){
    stats.losses++; stats.streak=0;
    emoji.textContent='🤖'; t.textContent='电脑赢了';
    txt.textContent='电脑先连成了五子。换个开局再试试，记得先堵它的活三活四！';
    sndLose();
  }else{
    stats.draws++; stats.streak=0;
    emoji.textContent='🤝'; t.textContent='和棋';
    txt.textContent='棋盘下满了，双方都没连成五子，平分秋色！';
    beep(440,0.2,'sine',0.12);
  }
  saveStats(); renderStats();
  setTurn(result==='win'?'🎉 你赢了！':(result==='lose'?'电脑获胜':'和棋'), null);
  overlay.classList.add('show');
}
function diffName(){ return difficulty==='easy'?'简单':(difficulty==='normal'?'普通':'困难'); }

function aiTurn(){
  if(over) return;
  busy=true;
  setTurn('🤖 电脑思考中…', aiColor);
  setTimeout(function(){
    var p = aiPick(board, aiColor, difficulty);
    var r = place(p.x,p.y,aiColor);
    if(r==='win'){ endGame('lose'); return; }
    if(r==='draw'){ endGame('draw'); return; }
    busy=false;
    setTurn('轮到你落子（'+(playerColor===1?'黑棋':'白棋')+'）', playerColor);
  }, 350 + Math.random()*450);
}

function playerMove(x,y){
  if(over || busy) return;
  if(!inBoard(x,y) || board[y][x]!==0) return;
  var r = place(x,y,playerColor);
  if(r==='win'){ endGame('win'); return; }
  if(r==='draw'){ endGame('draw'); return; }
  aiTurn();
}

function newGame(){
  board = newBoard();
  history=[]; over=false; busy=false; lastMove=null; hintPos=null;
  overlay.classList.remove('show');
  playerColor = aiFirstFlag ? 2 : 1;
  aiColor = playerColor===1 ? 2 : 1;
  draw();
  if(aiFirstFlag){ aiTurn(); }
  else setTurn('轮到你落子（黑棋）', 1);
}

/* ---- 输入 ---- */
function eventPos(e){
  var rect = canvas.getBoundingClientRect();
  var cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  var cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  var x = Math.round((cx/rect.width*600 - PAD)/CELL);
  var y = Math.round((cy/rect.height*600 - PAD)/CELL);
  return {x:x, y:y};
}
canvas.addEventListener('click', function(e){ var p=eventPos(e); playerMove(p.x,p.y); });
canvas.addEventListener('touchstart', function(e){
  e.preventDefault();
  var p=eventPos(e); playerMove(p.x,p.y);
}, {passive:false});

/* ---- 按钮 ---- */
document.getElementById('newBtn').addEventListener('click', newGame);
document.getElementById('againBtn').addEventListener('click', newGame);
document.getElementById('undoBtn').addEventListener('click', function(){
  if(busy || history.length===0) return;
  var n = over ? history.length : 2;   /* 终局后悔棋：整局清空重开更直观，改为只退两步 */
  if(over){ newGame(); return; }
  for(var i=0;i<n && history.length;i++){
    var m=history.pop(); board[m.y][m.x]=0;
  }
  lastMove = history.length ? history[history.length-1] : null;
  hintPos=null; draw();
  setTurn('轮到你落子（'+(playerColor===1?'黑棋':'白棋')+'）', playerColor);
});
document.getElementById('hintBtn').addEventListener('click', function(){
  if(over || busy) return;
  var p = aiPick(board, playerColor, 'hard', function(){ return 0.5; });
  hintPos = {x:p.x, y:p.y};
  draw();
  setTimeout(function(){ hintPos=null; if(!over) draw(); }, 2500);
  beep(880,0.12,'sine',0.1);
});
document.getElementById('resignBtn').addEventListener('click', function(){
  if(over) return;
  endGame('lose');
  document.getElementById('ovTitle').textContent='你认输了';
  document.getElementById('ovText').textContent='这局算电脑赢。别灰心，换个开局再战一局！';
});
document.getElementById('soundBtn').addEventListener('click', function(){
  soundOn=!soundOn;
  this.textContent = soundOn ? '🔊 音效开' : '🔇 音效关';
});
document.getElementById('diffSeg').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  difficulty=b.getAttribute('data-d');
  var btns=this.querySelectorAll('button');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('on');
  b.classList.add('on');
  newGame();
});
document.getElementById('aiFirst').addEventListener('change', function(){
  aiFirstFlag=this.checked;
  newGame();
});
document.addEventListener('visibilitychange', function(){
  if(document.hidden && !over) { /* 对局是回合制，无需自动暂停 */ }
});

renderStats();
newGame();
</script>
